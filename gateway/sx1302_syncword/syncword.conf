# /etc/lora/syncword.conf -- per-demodulator LoRa sync word, SX1302
#
# Values: "auto" (stock behaviour, derived from lorawan_public) or any sync
# word 0x00..0xFF (hex or decimal). Read at every lgw_start(), i.e. on each
# packet forwarder restart.
#
# The SX1302 has no per-IF-channel sync word register. The 8 multi-SF channels
# (chan_multiSF_0..7) share one demodulator block, split by spreading factor
# only -- so a single one of those 8 cannot have its own sync word. Only
# chan_Lora_std has an independent register pair.

# --- multi-SF block: applies to ALL of chan_multiSF_0..7 -------------------
sf5     = auto      # stock: 0x12
sf6     = auto      # stock: 0x12
sf7to12 = auto      # stock: 0x34 when lorawan_public=true  <- keep for LoRaWAN

# --- LoRa Service modem: chan_Lora_std alone ------------------------------
# This is the private / P2P channel. In global_conf.json it sits on radio 1,
# IF -375000 -> 868.125 MHz, SF7, 125 kHz ("RAW P2P ... TrackerD").
#
# 0x55 is the Ebyte E22 sync word, measured on the SX1302 (17.08.2026).
#
# EBYTE_E90.md documents it as 0x58, but that was only ever pinned down to its
# high nibble: an SX126x receiver evaluates just the first sync word register
# byte, so the sweep there hit on all of 0x58..0x5F and 0x58 was picked as the
# representative. The SX1302 checks BOTH peak positions strictly, which finally
# resolves the low nibble -- a live sweep of peak2 over /dev/spidev1.0 gave
# packets only at peak2 = 10, i.e. sync word 0x55.
#
# peak1 = 5*2 = 10, peak2 = 5*2 = 10.
service = 0x55

# --- LDRO des LoRa-Service-Modems ----------------------------------------
# auto = Regel des HAL (SET_PPM_ON: nur BW125+SF11/12 und BW250+SF12, bei
# BW500 also nie). Ebyte E22/E90 senden BW500 mit LDRO = 1 (gemessen, siehe
# gerontec/TTN devices/pico_sx1262/EBYTE_E90.md). Bei falschem LDRO rastet der
# Header ein, aber jede Nutzlast kommt mit CRC-Fehler -- sieht aus wie
# "fast richtig".
ldro = 1

# --- Sende-Syncword ---------------------------------------------------------
# sx1302_send() schreibt das TX-Syncword pro Paket neu, abgeleitet aus
# lorawan_public -- ein Downlink ginge also immer mit 0x34 raus, egal was auf
# der Empfangsseite steht. Eine Gegenstelle auf 0x55 (Ebyte-Repeater) hoerte das
# Gateway dann nie. auto = HAL-Verhalten, sonst 0x00..0xFF.
#
# ACHTUNG: gilt fuer JEDEN Downlink, auch die der LoRaWAN-Kanaele. Ein Gateway
# im LoRaWAN-Betrieb wuerde damit Join-Accepts und ADR-Kommandos auf einem
# Syncword senden, das kein LoRaWAN-Endgeraet annimmt. Deshalb steht hier auto.
#
# Nur auf 0x55 stellen, wenn ueber dieses Gateway keine LoRaWAN-Downlinks gehen
# muessen. Sauberer waere eine Umschaltung nach TX-Frequenz -- der Rohkanal
# liegt auf 868.125, LoRaWAN-Downlinks auf RX1/RX2. Noch nicht umgesetzt.
tx = auto
