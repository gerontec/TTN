# Der Paket-Multiplexer sitzt vor dem Gateway Bridge und faechert denselben
# UDP-Strom des DLOS8N auf zwei Netzwerkserver auf.
#
# Warum hier und nicht am Gateway: dort haengt der Rohkanal-Syncword an einem
# angepassten Forwarder (fwd_syncword), der seine Register nach dem Start
# gesetzt bekommt. Jeder Neustart dort gefaehrdet den Krisenkanal. Auf dem
# dell ist die Aenderung jederzeit ruecknehmbar.
#
#   Gateway :1700 -> Multiplexer -> 127.0.0.1:1710  ChirpStack (lokal)
#                                -> eu1...:1700     TTN, nur hoerend

[logging]
  level = "info"

[multiplexer]
  bind = "0.0.0.0:1700"

  # Lokaler ChirpStack. Behaelt die Downlink-Hoheit: der Krisen-Rundruf haengt
  # daran, und zwei antwortende Netze wuerden sich mit eigenen FCntDown und im
  # selben RX-Fenster gegenseitig zerstoeren.
  [[multiplexer.server]]
    server = "127.0.0.1:1710"
    uplink_only = false

  # TTN-Backend am 24.08.2026 wieder entfernt: das Gateway sendet selbst an
  # TTN (server1, trotz "enable": "false" -- der String ist wahr), sonst kaeme
  # jeder Uplink doppelt bei TTS an.
