# /etc/systemd/system/lora-raw.service.d/all.conf auf dell-3660
#
# --all        jeder rxpk nach MQTT, nicht nur der Rohkanal
# --power 27   erhoeht am 17.08.2026. Am Empfangsort brachte das gegenueber
#              14 dBm gemessen nur +5 dB, nicht die +13 dB der Tabelle -- die
#              tx_gain_lut des Gateways liefert oben nicht, was sie verspricht.
#              In 868.0-868.6 gelten 25 mW ERP; ob das eingehalten ist, haengt
#              an Antennen- und Kabelverlust des konkreten Aufbaus.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /home/gh/python/lora_raw.py --mqtt --all --power 27
