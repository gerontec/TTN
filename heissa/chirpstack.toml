# --- Logging ---
[logging]
  level = "info"

# --- PostgreSQL configuration ---
[postgresql]
  dsn = "postgres://chirpstack:<ENTFERNT>@localhost/chirpstack?sslmode=disable"
  max_open_connections = 10
  min_idle_connections = 0

# --- Redis configuration ---
[redis]
  servers = ["redis://localhost/"]
  cluster = false

# --- Network related configuration ---
[network]
  net_id = "000000"
  enabled_regions = ["eu868"]

# --- API interface configuration ---
[api]
  bind = "0.0.0.0:8080"
  # WICHTIG: Ersetze dies niemals durch Leerzeichen.
  secret = "<ENTFERNT>"

# --- Gateway Backend (MQTT-Fokus für lorarep.py) ---
[gateway]
  enabled_backends=["mqtt"]

[gateway.backend.mqtt]
  server="tcp://127.0.0.1:1883"
  # Diese Zeilen müssen exakt so aussehen:
  event_topic_template="gateway/{{ gateway_id }}/event/{{ event }}"
  command_topic_template="gateway/{{ gateway_id }}/command/{{ command }}"
  json=true
# --- Integration (MQTT-Daten für Applikationen) ---
[integration]
  enabled_integrations = ["mqtt"]

  [integration.mqtt]
    server = "tcp://127.0.0.1:1883/"
    json = true
    # Standard-Templates für die App-Ebene
    event_topic_template="application/{{ application_id }}/device/{{ dev_eui }}/event/{{ event }}"
    command_topic_template="application/{{ application_id }}/device/{{ dev_eui }}/command/{{ command }}"
