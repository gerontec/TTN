; Dragino TrackerD v1.5.3, unveraendert -- Vergleichsbasis
;
; Quelle: dragino/TrackerD v1.5.3 (repo/Example/LoRaWAN/examples/TrackerD),
; erweitert um tracklog.* - Positionen werden immer lokal geloggt und nach
; Wiederkehr der Funkverbindung nachgeliefert.
;
; Wie bei ../p2p wird NIE nach 0x10000 geflasht: dort bleibt die
; Dragino-Werksfirmware v1.4.8 als Rueckweg liegen.
;
;   pio run                       -> .pio/build/trackerd_stock/firmware.bin
;   ../switch_app.py ...          -> Image nach app1 (0x1F0000) + Bootwahl

[env:trackerd148]
platform = espressif32@6.5.0   ; arduino-esp32 2.0.14 - der Sketch ist 2.x-Code, Core 3.x bricht ihn
board = pico32
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions_trackerd.csv
; Projekteigene Variante statt Eingriff in die Framework-Dateien: der TrackerD
; ist auf SCK 5 / MISO 19 / MOSI 27 / NSS 18 verdrahtet, die pico32-Vorgabe
; passt nicht. Damit baut Draginos Quelltext unveraendert und bootet.
board_build.variants_dir = variants
board_build.variant = trackerd
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D DISABLE_PING
    -D DISABLE_BEACONS
    -D LMIC_DEBUG_LEVEL=1
    -D USE_ORIGINAL_AES
    -D LMIC_LORAWAN_SPEC_VERSION=LMIC_LORAWAN_SPEC_VERSION_1_0_3
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D LMIC_PRINTF_TO=Serial
