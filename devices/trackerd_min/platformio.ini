; TrackerD, minimaler Fork auf Draginos v1.4.8 (Tag; der Quelltext meldet 1.4.6)
;
; Grundsatz: so nah am Werksstand wie moeglich. Drin ist nur, was in
; patches/ steht -- alles andere ist unveraendert Dragino. Der Grund steht in
; README.md: ein groesserer Fork hatte am Alarm Verhalten geaendert, das nicht
; bestellt war, und das faellt in einem Geraet, dem man im Ernstfall vertrauen
; koennen muss, nicht auf, bevor es zaehlt.
;
;   ssh gh@192.168.5.23 ; cd ~/trackerd_build
;   git clone --branch v1.4.8 --depth 1 https://github.com/dragino/TrackerD.git repo148
;   cp -a repo148/Example/LoRaWAN/examples/TrackerD/. forkmin/src/
;   cp -a repo148/Library/arduino-lmic/arduino-lmic forkmin/lib/arduino-lmic
;   for f in patches/fix_holds.py patches/fix_defaults_on.py patches/fix_alarm_autostop.py; do python3 "$f" forkmin/src; done
;   python3 patches/fix_aes_len.py forkmin/lib/arduino-lmic
;   cd forkmin && ~/.platformio/penv/bin/pio run
;
;   -> .pio/build/trackerdmin/firmware.bin
;   ../trackerd_p2p/switch_app.py flash --bin <firmware.bin>   (app1 + Bootwahl)

[env:trackerdmin]
platform = espressif32@6.5.0   ; arduino-esp32 2.0.14 - der Sketch ist 2.x-Code, Core 3.x bricht ihn
board = pico32
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions_trackerd.csv
; Projekteigene Variante statt Eingriff in die Framework-Dateien: der TrackerD
; ist auf SCK 5 / MISO 19 / MOSI 27 / NSS 18 verdrahtet, die pico32-Vorgabe
; passt nicht. Damit baut Draginos Quelltext unveraendert und bootet.
board_build.variants_dir = variants
board_build.variant = trackerd
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D DISABLE_PING
    -D DISABLE_BEACONS
    -D LMIC_DEBUG_LEVEL=1
    -D USE_ORIGINAL_AES
    -D LMIC_LORAWAN_SPEC_VERSION=LMIC_LORAWAN_SPEC_VERSION_1_0_3
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D LMIC_PRINTF_TO=Serial
