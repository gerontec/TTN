; TrackerD P2P - rohes LoRa als Zweitfirmware im OTA-Slot app1.
;
; Das Image wird NIE nach 0x10000 geschrieben. Dort bleibt die Dragino-
; LoRaWAN-Firmware unangetastet liegen. Geflasht wird ausschliesslich
; app1 (0x1F0000), umgeschaltet wird ueber otadata - siehe ../switch_app.py.
;
;   pio run                      -> .pio/build/trackerd_p2p/firmware.bin
;   ../switch_app.py p2p         -> Image nach app1 + Bootwahl app1
;   ../switch_app.py lorawan     -> zurueck auf app0

[env:trackerd_p2p]
platform = espressif32
board = pico32
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions_trackerd.csv
monitor_speed = 115200
upload_speed = 921600

; Kein upload ueber pio - das wuerde die Partitionstabelle und app0
; ueberschreiben. Flashen macht switch_app.py gezielt nach 0x1F0000.
