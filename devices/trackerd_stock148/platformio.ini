; TrackerD, sauberer Fork auf Draginos v1.4.8 (Tag; der Quelltext meldet 1.4.6)
;
; Werksverhalten bis auf zwei Startwerte: Sport-Mode und Datalog sind ab Werk
; an, und ein Alarm endet nach 99 gueltigen Positionen. Die beiden anderen
; Patches aendern keine Funktion des Geraets: einer
; loest die RTC-Pad-Holds beim Start (ohne ihn laeuft der Bau in eine
; Neustartschleife), der andere behebt einen Fehler in arduino-lmic.
; Mehr steht in README.md.
;
;   ssh gh@192.168.5.23 ; cd ~/trackerd_build
;   git clone --branch v1.4.8 --depth 1 https://github.com/dragino/TrackerD.git repo148
;   cp -a repo148/Example/LoRaWAN/examples/TrackerD/. forkstock/src/
;   cp -a repo148/Library/arduino-lmic/arduino-lmic forkstock/lib/arduino-lmic
;   python3 patches/fix_holds.py forkstock/src
;   python3 patches/fix_pad_levels_sleep.py forkstock/src
;   python3 patches/fix_gps_uart_once.py forkstock/src
;   python3 patches/fix_datalog_sensitive.py forkstock/src
;   python3 patches/fix_defaults_on.py forkstock/src
;   python3 patches/fix_alarm_gpsfix_stop.py forkstock/src
;   python3 patches/fix_aes_len.py forkstock/lib/arduino-lmic
;   cd forkstock && ~/.platformio/penv/bin/pio run
;
;   -> .pio/build/trackerdstock/firmware.bin
;   ../trackerd_p2p/switch_app.py flash --bin <firmware.bin>   (app1 + Bootwahl)

[env:trackerdstock]
; arduino-esp32 2.0.2, der Core, mit dem Draginos app0 gebaut ist. Nachgewiesen
; am 04.09.2026: app0 traegt IDF v4.4-dev-3544-g2720d45e71 und Bau-Datumsstrings
; von Oktober 2021, spricht den UART bare-metal an (einziges Symbol
; uart_enable_intr_mask) -- waehrend 2.0.14 den IDF-Treiber nutzt
; (uart_context, uart_event_task, uart_set_rx_full_threshold, uart_set_rx_timeout).
; Gemessen am selben Platz in derselben Minute: app0 bekommt 2 s nach
; `Start searching for GPS...` NMEA herein, der Bau mit 2.0.14 in 180 s keines.
; Der GPS-UART liegt auf GPIO 9/10, den SD_DATA-Pads des PICO-D4.
platform = espressif32@4.4.0   ; arduino-esp32 2.0.3 -- kennt EEPROMClass("name"), ruft aber noch
                               ; kein uart_set_rx_timeout/setRxFIFOFull (kam mit 2.0.5)
board = pico32
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions_trackerd.csv
; Projekteigene Variante statt Eingriff in die Framework-Dateien: der TrackerD
; ist auf SCK 5 / MISO 19 / MOSI 27 / NSS 18 verdrahtet, die pico32-Vorgabe
; passt nicht. Damit baut Draginos Quelltext unveraendert und bootet.
board_build.variants_dir = variants
board_build.variant = trackerd
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D DISABLE_PING
    -D DISABLE_BEACONS
    -D LMIC_DEBUG_LEVEL=1
    -D USE_ORIGINAL_AES
    -D LMIC_LORAWAN_SPEC_VERSION=LMIC_LORAWAN_SPEC_VERSION_1_0_3
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D LMIC_PRINTF_TO=Serial
